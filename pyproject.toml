[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "basecamp"
description = "Game-server manager for the prod PC"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "psutil>=6.1",
    "pydantic>=2.9",
    "uvicorn>=0.32",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[tool.setuptools]
packages = ["basecamp", "basecamp.api"]

[tool.setuptools.package-data]
basecamp = ["web/*", "web/fonts/*/*", "release_key.pub"]

[tool.setuptools.dynamic]
version = { attr = "basecamp.__version__" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
# Starlette's test client asks for httpx2; httpx still works.
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
