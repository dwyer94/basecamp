[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "basecamp"
description = "Game-server manager for the prod PC"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "psutil>=6.1",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[tool.setuptools]
packages = ["basecamp"]

[tool.setuptools.dynamic]
version = { attr = "basecamp.__version__" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
