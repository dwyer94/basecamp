<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basecamp</title>
<script>
  // Before the first paint, so a dark theme doesn't flash light (common.js keeps it).
  try { const t = localStorage.getItem("bc-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { /* follow the system */ }
</script>
<link rel="preload" href="/static/fonts/instrument-sans/InstrumentSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/bricolage-grotesque/BricolageGrotesque-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161c19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Basecamp">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
</head>
<body data-role="loading">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 20 12 4l9 16z"/><path d="M9.5 20 12 15.5l2.5 4.5"/></symbol>
    <symbol id="i-servers" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-template" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 9v11"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h4"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .7 3 2.6 3 6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <a class="brand" href="#dashboard"><span class="logo"><svg class="i" aria-hidden="true"><use href="#i-logo"/></svg></span><span>Basecamp</span></a>
  <span class="offline" id="offline" hidden><svg class="i" aria-hidden="true"><use href="#i-wifi"/></svg>Reconnecting…</span>
  <span class="spacer"></span>
  <a class="btn primary sm newgame-top admin-only" href="#newgame"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>New game</a>
  <button class="iconbtn" id="theme" type="button" aria-label="Theme: follows the system"></button>
  <span class="who" id="who"></span>
</header>

<div class="previewbar" id="previewbar" role="status" hidden></div>

<div class="shell">
  <nav class="side" aria-label="Main">
    <a class="btn primary admin-only" href="#newgame"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>New game</a>
    <a class="navlink" href="#dashboard" data-nav="dashboard"><svg class="i" aria-hidden="true"><use href="#i-servers"/></svg>Servers</a>
    <a class="navlink" href="#activity" data-nav="activity"><svg class="i" aria-hidden="true"><use href="#i-activity"/></svg>Activity<span class="count admin-only" data-failcount hidden></span></a>
    <a class="navlink admin-only" href="#templates" data-nav="templates"><svg class="i" aria-hidden="true"><use href="#i-template"/></svg>Templates</a>
    <a class="navlink admin-only" href="#prefs" data-nav="prefs"><svg class="i" aria-hidden="true"><use href="#i-sliders"/></svg>Settings</a>
    <div class="foot" id="side-foot"></div>
  </nav>

  <main id="main"><p class="hint" style="padding:24px 0">Loading…</p></main>
</div>

<nav class="tabbar" aria-label="Main">
  <a href="#dashboard" data-nav="dashboard"><svg class="i" aria-hidden="true"><use href="#i-servers"/></svg>Servers</a>
  <a href="#activity" data-nav="activity"><svg class="i" aria-hidden="true"><use href="#i-activity"/></svg>Activity<span class="count admin-only" data-failcount hidden></span></a>
  <a class="admin-only" href="#templates" data-nav="templates"><svg class="i" aria-hidden="true"><use href="#i-template"/></svg>Templates</a>
  <a class="admin-only" href="#prefs" data-nav="prefs"><svg class="i" aria-hidden="true"><use href="#i-sliders"/></svg>Settings</a>
</nav>

<dialog id="confirm" aria-labelledby="confirm-title">
  <form method="dialog" class="inner">
    <h2 id="confirm-title"></h2>
    <div id="confirm-body" class="muted"></div>
    <div class="btnrow">
      <button class="btn" id="confirm-cancel" value="cancel">Cancel</button>
      <button class="btn primary" id="confirm-ok" value="ok">OK</button>
    </div>
  </form>
</dialog>

<script src="/static/common.js"></script>
<script src="/static/app.js"></script>
<script src="/static/pages.js"></script>
</body>
</html>
